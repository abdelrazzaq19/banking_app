name: newtronic_banking
description: A Banking App made with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  google_fonts: ^8.2.1
  flutter_svg: ^2.3.0
  lottie: ^3.5.1
  shimmer: ^4.0.0
  intl: ^0.20.3
  cached_network_image: ^4.0.0
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  fl_chart: ^1.1.1
  qr_flutter: ^4.1.0
  flutter_animate: ^4.5.2
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "lib/assets/images/newtronic.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - lib/assets/images/
    - lib/assets/json/
    - lib/assets/lotties/
